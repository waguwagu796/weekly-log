---
layout: default
title: "새 주간 보고 작성"
---

<style>
  .form-group { margin-bottom: 20px; }
  .form-group label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.95rem; }
  .form-input, .form-textarea {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.95rem;
    font-family: inherit;
    box-sizing: border-box;
  }
  .form-textarea { min-height: 260px; resize: vertical; line-height: 1.6; }
  .btn {
    background: var(--primary);
    color: white;
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.95rem;
  }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .settings-box {
    background: #f1f5f9;
    padding: 16px;
    border-radius: 8px;
    margin-bottom: 24px;
    font-size: 0.88rem;
  }
  .status-msg { margin-top: 12px; font-size: 0.9rem; font-weight: 600; }
</style>

<h2 style="margin-top:0;">✍️ 새 주간 업무 보고 작성</h2>

<!-- API 설정 영역 (로컬 스토리지에 저장되어 최초 1회만 입력) -->
<div class="settings-box">
  <details>
    <summary style="cursor: pointer; font-weight: 600; color: #334155;">⚙️ GitHub 연동 설정 (최초 1회 설정 필요)</summary>
    <div style="margin-top: 12px;">
      <div class="form-group">
        <label>GitHub 사용자명 (Username)</label>
        <input type="text" id="gh-owner" class="form-input" placeholder="예: your-username">
      </div>
      <div class="form-group">
        <label>저장소 이름 (Repository)</label>
        <input type="text" id="gh-repo" class="form-input" placeholder="예: weekly-log 또는 username.github.io">
      </div>
      <div class="form-group">
        <label>GitHub Personal Access Token (repo 쓰기 권한)</label>
        <input type="password" id="gh-token" class="form-input" placeholder="ghp_xxxx 또는 github_pat_xxxx">
        <p style="color: var(--text-muted); font-size: 0.8rem; margin-top: 4px;">* 토큰은 서버로 전송되지 않고 본인 브라우저(localStorage)에만 안전하게 저장됩니다.</p>
      </div>
      <button type="button" class="btn" style="background: #475569;" onclick="saveConfig()">설정 저장</button>
    </div>
  </details>
</div>

<!-- 작성 폼 -->
<form id="report-form" onsubmit="publishReport(event)">
  <div class="form-group">
    <label for="post-title">보고서 제목</label>
    <input type="text" id="post-title" class="form-input" required placeholder="예: 2026년 10월 2주차 주간 업무 보고">
  </div>

  <div class="form-group">
    <label for="post-date">작성일 (YYYY-MM-DD)</label>
    <input type="date" id="post-date" class="form-input" required>
  </div>

  <div class="form-group">
    <label for="post-content">본문 (Markdown 형식)</label>
    <textarea id="post-content" class="form-textarea" required></textarea>
  </div>

  <button type="submit" id="submit-btn" class="btn">🚀 GitHub에 저장 및 배포</button>
  <div id="status-msg" class="status-msg"></div>
</form>

<script>
  // 기본 템플릿 세팅
  const defaultTemplate = `## 1. Progress (이번 주 완료한 일)
* **업무 A** <span class="badge badge-done">완료</span>
  * 세부 성과 내용 작성
* **업무 B** <span class="badge badge-done">완료</span>
  * 세부 내용 작성

## 2. In Progress (진행 중인 일)
* **업무 C** <span class="badge badge-prog">진행 중</span>
  * 현재 진척 상황

## 3. Plan (다음 주 계획)
* 다음 주 착수 예정 업무

## 4. Problems & Blockers (이슈 및 지원 요청)
* 특이사항 없음`;

  // 페이지 로드 시 기존 설정 불러오기
  window.addEventListener('DOMContentLoaded', () => {
    document.getElementById('post-date').value = new Date().toISOString().substring(0, 10);
    document.getElementById('post-content').value = defaultTemplate;

    const savedOwner = localStorage.getItem('gh_owner');
    const savedRepo = localStorage.getItem('gh_repo');
    const savedToken = localStorage.getItem('gh_token');

    if (savedOwner) document.getElementById('gh-owner').value = savedOwner;
    if (savedRepo) document.getElementById('gh-repo').value = savedRepo;
    if (savedToken) document.getElementById('gh-token').value = savedToken;
  });

  function saveConfig() {
    const owner = document.getElementById('gh-owner').value.trim();
    const repo = document.getElementById('gh-repo').value.trim();
    const token = document.getElementById('gh-token').value.trim();

    if (!owner || !repo || !token) {
      alert('모든 설정값을 입력해주세요.');
      return;
    }

    localStorage.setItem('gh_owner', owner);
    localStorage.setItem('gh_repo', repo);
    localStorage.setItem('gh_token', token);
    alert('설정이 브라우저에 저장되었습니다.');
  }

  async function publishReport(e) {
    e.preventDefault();

    const owner = localStorage.getItem('gh_owner');
    const repo = localStorage.getItem('gh_repo');
    const token = localStorage.getItem('gh_token');

    if (!owner || !repo || !token) {
      alert('상단의 GitHub 연동 설정을 먼저 완료해주세요.');
      return;
    }

    const title = document.getElementById('post-title').value.trim();
    const date = document.getElementById('post-date').value;
    const bodyContent = document.getElementById('post-content').value;
    const btn = document.getElementById('submit-btn');
    const status = document.getElementById('status-msg');

    // 파일명 생성: _weekly/2026-10-07-report.md
    const filename = `_weekly/${date}-${Date.now().toString().slice(-4)}.md`;

    // Jekyll Front Matter 구성
    const fileData = `---
layout: default
title: "${title}"
date: ${date}
---

# ${title}
<div class="meta">작성일: ${date}</div>

${bodyContent}

<a href="{{ '/' | relative_url }}" class="back-btn">← 전체 목록으로 돌아가기</a>
`;

    // UTF-8 base64 인코딩
    const base64Content = btoa(encodeURIComponent(fileData).replace(/%([0-9A-F]{2})/g, (match, p1) => {
      return String.fromCharCode('0x' + p1);
    }));

    btn.disabled = true;
    status.style.color = 'var(--primary)';
    status.textContent = 'GitHub에 커밋을 생성하고 있습니다...';

    try {
      const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${filename}`, {
        method: 'PUT',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Accept': 'application/vnd.github.v3+json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          message: `Add weekly report: ${title}`,
          content: base64Content
        })
      });

      if (!response.ok) {
        const errorData = await response.json();
        throw new Error(errorData.message || '저장 실패');
      }

      status.style.color = '#15803d';
      status.textContent = '성공적으로 저장되었습니다! 1~2분 후 GitHub Pages 빌드가 완료되면 메인 목록에 표시됩니다.';
      setTimeout(() => {
        window.location.href = "{{ '/' | relative_url }}";
      }, 2500);

    } catch (err) {
      status.style.color = '#b91c1c';
      status.textContent = `오류 발생: ${err.message}`;
      btn.disabled = false;
    }
  }
</script>
