<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | {{ site.title }}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --primary: #2563eb;
      --border: #e2e8f0;
      --badge-done: #dcfce7;
      --badge-done-text: #15803d;
      --badge-prog: #dbeafe;
      --badge-prog-text: #1d4ed8;
      --badge-block: #fee2e2;
      --badge-block-text: #b91c1c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 40px 20px;
    }
    .container {
      max-width: 860px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 20px;
    }
    header h1 a {
      color: var(--text);
      text-decoration: none;
      font-size: 1.6rem;
      font-weight: 700;
    }
    header p { color: var(--text-muted); font-size: 0.95rem; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.03);
      margin-bottom: 24px;
    }
    /* 본문 마크다운 스타일링 */
    .card h1 { font-size: 1.5rem; margin-bottom: 8px; }
    .card h2 { font-size: 1.25rem; margin-top: 28px; margin-bottom: 12px; border-bottom: 2px solid var(--border); padding-bottom: 6px; }
    .card h3 { font-size: 1.1rem; margin-top: 18px; margin-bottom: 8px; color: var(--primary); }
    .card ul { margin-left: 20px; margin-bottom: 16px; }
    .card li { margin-bottom: 6px; }
    .card strong { color: #0f172a; }
    .meta {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 24px;
    }
    /* 뱃지 클래스 */
    .badge {
      display: inline-block;
      font-size: 0.78rem;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 600;
      vertical-align: middle;
      margin-left: 6px;
    }
    .badge-done { background: var(--badge-done); color: var(--badge-done-text); }
    .badge-prog { background: var(--badge-prog); color: var(--badge-prog-text); }
    .badge-block { background: var(--badge-block); color: var(--badge-block-text); }
    /* 인덱스 리스트 */
    .post-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
      border-bottom: 1px solid var(--border);
    }
    .post-item:last-child { border-bottom: none; }
    .post-item a {
      font-weight: 600;
      color: var(--text);
      text-decoration: none;
    }
    .post-item a:hover { color: var(--primary); }
    .back-btn {
      display: inline-block;
      margin-top: 20px;
      font-size: 0.9rem;
      color: var(--primary);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
        <p>{{ site.description }}</p>
      </div>
      <div>
        <span style="font-size: 0.9rem; color: var(--text-muted);">{{ site.author }}</span>
      </div>
    </header>

    <main class="card">
      {{ content }}
    </main>
  </div>
</body>
</html>
